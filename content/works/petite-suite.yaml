remarks:
  - >-
    Incipits restitués d’après la transcription d’oreille du témoignage sonore
    de la création issu du disque INA : *Le Rêve du monde*. 

    L’œuvre est cataloguée par l’auteur sous le titre de « Petite Suite » dans
    le CaG.


    [1961]. Date établie d’après l’annonce faite lors de la création (mai 1962 ;
    enregistrement INA) : « écrite à l’âge de onze ans », soit entre le 3
    janvier 1961 et le 2 janvier 1962. Aucune source ne permet de situer l’œuvre
    plus précisément dans l’année.


    Ordre relatif avec T 5 (*Cinq Chansons enfantines*, op. 1, 1961) :
    incertain. 

    La *Petite Suite* est placée avant l’op. 1 par convention, sur la foi d’un
    indice stylistique : son écriture, telle que la restitue l’enregistrement de
    1962, paraît moins élaborée que celle de l’op. 1. Mais cet indice est
    fragile. L’op. 1 n’est connu que par un manuscrit de 1973 (mention « 61-73
    »), qui peut refléter une potentielle révision postérieure ; la comparaison
    porte en outre sur des sources de nature différente (enregistrement et
    partition) et sur des genres distincts.
