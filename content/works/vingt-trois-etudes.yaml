journal:
  - date_text: 2 juin 1969
    date: '1969-06-02'
    quotes:
      - '« Dans le cadre de l''émission de télévision "Les jeunes invités de la musique", produite par Tasso Janopoulos, l''écrivain Paul Vialar me reçoit et j''interprète la Toccata de Bach et Quatre études de mon cru. » [Greif a interprété quatre études extraites de l''op. 21 : « La Machine à coudre », « La Tourmentée », « La Chasseresse », « Les Tourterelles » ainsi qu''une autre étude absente du manuscrit. Le contenu de cette émission est consultable dans les archives INA : date de diffusion, 19.04.1969 ; ID Notice : CPF92017489.]'
