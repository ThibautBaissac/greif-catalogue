  intro: Ms composite constitué d'un lot de feuilles recopiées à une date ultérieure (non précisée) à la date de composition (études nº1 à 7) et d'un lot de feuilles extraites du Ms. d'origine (études nº11 à 26) pour un total de vingt-trois études comme indiqué dans le CaG.
  papers:
