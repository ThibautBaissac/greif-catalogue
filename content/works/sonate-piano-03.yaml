journal:
  - date_text: 6 août 1969
    date: '1969-08-06'
    quotes:
      - |-
        « Je donne un récital dans l'Église catholique de Champéry, en Suisse, [...]. Le programme comprend [...] un travail personnel, *Quatre soli* pour piano, composé en 1968.

        [Extraits de deux des trois critiques parues à la suite de ce concert dans les journaux suisses :] "[Greif] s'est essayé également dans la composition. Thèmes traditionnels, avec parfois des recherches mélodiques modernes, des envolées impulsives où le jeune homme fougueux supplante l'artiste qui s'est imposé une discipline basée sur le plus pur classicisme."

        "Compositeur, [Greif] a interprété une de ses œuvres, 'Quatre soli pour un piano', œuvre qui a été très appréciée étant du 'classique-moderne'." »
