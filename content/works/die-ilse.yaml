    - text: 'Ms. autographe à l''encre noire avec ajouts au crayon, paginé : II-XXXIX ; X f., 39 pages de musique, papier filigrané JD, 270 x 350 mm à 14 portées ; quelques passages biffés, avec indications de tempo, de nuances et de phrasé, avec nº de mes., conducteur sans parties séparées, complet. Page de titre : « - Paradisiac Memories nº2 | nº2 : "The ballad of Gulliver in his mother''s | cunt" | including: "Die Ilse" | a poem by Heinrich | Heine - | for mezzo-soprano, clarinet, string quartet, | piano and percussion - | Pour mon amie | Isabelle Colin Dufresne [*sic*] ». Au vº : « Pour mon amie Isabelle Colin Dufresne [*sic*] | Paris | the fifth of january – 19772 – » [*sic*] Présence sur la page de titre et la page II d''autocollants rouge « FRAGILE | HANDLE WITH CARE ». Page XXXIX, « PARIS – 8 AVRIL 1972 – | [signé] Olivier | Greif » à droite de la barre de mesure finale de l''œuvre.'
