remarks:
  - Nous ignorons si la version d'origine a subi des modifications lors de cette mise au net datant de 1974. La dédicace date de la réécriture. Le brouillon de la dernière page du 1^er^ mvt. a survécu à la destruction du manuscrit de l'œuvre avant réécriture au vº d'une des pièces du *Piano Book,* [[?]], le « Rondo » de mai 1967.
