journal:
  - date_text: 8 octobre 1971
    date: '1971-10-08'
    quotes:
      - |-
        « En me rejouant il y a quelques instants de cela mon *In Memoriam* pour piano, l'entrevue que j'eus en juin de cette année avec Maurice Fleuret et Henry-Louis de la Grange me revint à la mémoire.

        C'est ce même travail que j'interprétais pour eux. Maurice Fleuret, en particulier, se montra très franc à mon égard. Il trouvait cela "inaudible". "Vous jouez bien de votre instrument. Mais la composition, c'est autre chose. Votre musique est morte. Il faut la réveiller aux préoccupations de notre époque." »
  - date_text: 26 octobre 1972
    date: '1972-10-26'
    quotes:
      - « A onze heures, arrivée à la classe de Tony Aubin d'Aram Khatchatourian, accompagné d'une interprète. Je joue pour lui *In Memoriam*. "Vous avez un très grand talent", me dit-il. Il fait d'autres commentaires sur moi à Tony. Il pose ensuite des questions aux uns et aux autres. Il souhaite notamment savoir l'importance que nous attachons au public. »
  - date_text: 11 mai 1975
    date: '1975-05-11'
    quotes:
      - « [...] Messiaen n'a pas du tout aimé *In Memoriam* que je lui jouais voilà cinq ans ! »
  - date_text: 13 mars 1992
    date: '1992-03-13'
    quotes:
      - '« Comment ne pas me souvenir que j''ai moi-même rencontré Henry-Louis de la Grange et Maurice Fleuret afin de leur jouer ma musique, alors que je venais tout juste d''avoir vingt et un ans ? Je m''étais rendu chez eux et leur avais joué ma petite pièce pour piano : *In memoriam*. Je revois encore l''emplacement du piano. "Vous n''avez pas assez de personnalité. Vous devriez abandonner la composition, il y a trop de concurrence", fut leur conseil. »'
documents:
  - 'Note de programme écrite par le compositeur pour le concert du 27 septembre 1978 pour la 3^e^ nuit de l''AMIF au centre Rachi de Paris :'
  - '« *In Memoriam* fut composé en 1969, alors que l''auteur étudiait à New York sous la direction de Luciano Berio. C''est une sorte de flot subjectif (Joyce parlerait de "Stream of consciousness") bâti pourtant sur une trame formelle stricte : celle de l''allegro de sonate.'
  - Comme dans le troisième mouvement de la *Sinfonia* de Berio (dont il est permis de déceler l'influence), on y entend plusieurs dizaines de thèmes empruntés à des œuvres connues du répertoire classique et contemporain ; non point suite fortuite de collages, mais plutôt tourbillon émotionnel entraînant dans sa chute quelques-uns des moments forts de l'histoire de la musique, violant la paix de notre mémoire... »
