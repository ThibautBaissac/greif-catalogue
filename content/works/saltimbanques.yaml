documents:
  - « À cette époque –- les années 60 – et dans la classe de composition où je me trouvais – celle de Tony Aubin – l'écriture de mélodies françaises était un passage obligé, [...]. Je me souviens que Tony Aubin, sans doute de crainte que je ne m'égare dans le choix des textes, me conseilla – le mot est faible – les noms des auteurs le long des vers desquels j'allais déposer ma musique. C'est ainsi que l'adolescent que j'étais pris Apollinaire, Verlaine, du Bellay, ou encore Baudelaire, pour support de ses premiers essais de mélodiste. »
  - O. Greif, « Pourquoi écrire des mélodies sur des textes en langues étrangères... », *Le Journal de l'A.F.P.C.*, nº5, juillet 1998, p. 57-61
