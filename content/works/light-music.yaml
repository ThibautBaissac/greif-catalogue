  - date_text: 2 octobre 1974
    date: '1974-10-02'
    quotes:
      - « Fini d'écrire "Werdet mir nicht ungeduldig" commence hier au soir. »
  - date_text: 4 octobre 1974
    date: '1974-10-04'
    quotes:
      - « Commencé hier (et presque achevé) "Mir traümte von einem Königskind". Toutes ces petites pièces (Lieder, duos et éventuellement morceaux de piano, inclus deux lieder de 1972, "Die Sterne in der Höh'" et "Ein Hüngling liebt ein Mädchen", dans l'ensemble d'un caractère trop sérieux) seront regroupées plus tard en un cycle appelé "Light Music". Musique légère, sans prétention, bien ouvragée, écrite pour mon plaisir. L'ensemble occupera la durée d'une soirée, un entracte est prévu. Chaque morceau peut être joué séparément du cycle. »
