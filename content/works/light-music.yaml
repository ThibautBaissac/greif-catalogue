sources:
  status: located
  intro: 'Ce cycle est un ensemble composite de sept *Lieder* (dont deux inachevés : 1 et 7). La description suivante respecte la structure qui se dégage de l''organisation des *Lieder* : séparés les uns des autres, ils datent tous de 1974, à l''exception du bloc central de trois Lieder datés de 1972. Le premier et le dernier sont en duo pour soprano et baryton avec piano, les autres sont pour baryton et piano.'
  papers:
