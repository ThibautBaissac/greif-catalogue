remarks:
  - Les deux mélodies indépendantes *The Spirit's Song* et *Time is on my side* ([[the-spirit-s-song]], op. 58 et [[time-is-on-my-side]], op.59) portent toutes deux la mention "Light Music" en haut à gauche de leur première page de Ms., laissant entendre qu'elles étaient destinées à rejoindre le cycle lors de l'exécution complète prévue par le compositeur, *cf*. Carnet de bord, 4 octobre 1974.
