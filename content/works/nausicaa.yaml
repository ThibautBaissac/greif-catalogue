discography:
  - text: >-
      Source sonore : aucune connue. 

      Un enregistrement de cette audition a très probablement été réalisé.
      Lucette Descaves faisait en effet enregistrer sur disque vinyle les
      auditions de ses élèves, comme en témoignent les disques conservés des
      auditions de [juin 1960] et de [mai 1962], au cours desquelles furent
      créées respectivement les *Danses villageoises* (T 2) et la *Petite Suite*
      (T 4). Aucun exemplaire du disque de l’audition du 2 juillet 1959 n’a
      cependant été localisé à ce jour. S’il était retrouvé, il constituerait
      l’unique témoignage musical de l’œuvre, dont la partition est perdue.


      Recherches : 

      Ont été contactés en dehors de la famille Greif, deux des élèves ayant
      participé à cette audition de 1959 : Philippe Hersant et Igor Wakhévitch,
      qui, s'ils confirment se souvenir de l’évènement n’ont pas gardé trace de
      l’enregistrement. 

      État au 06.11.2026.
