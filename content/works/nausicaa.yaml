documents:
  - >-
    « À la dernière audition des élèves, [Olivier] a joué un morceau qu’il a
    composé lui-même. Ça s’appelle *Nausicaa aux bras blancs*. C’est une
    princesse qui recueille Ulysse dans l’Odyssée. [...] C’est une version pour
    enfants : Contes et légendes tirés de l’Iliade et de l’Odyssée. »
    Jean-Jacques Greif, *Sans accent*, p. 217.
