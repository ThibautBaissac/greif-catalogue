  intro: 'Ms. autographe à l''encre noire et au crayon, paginé : 1-78 ; 41 f., 78 p. de musique, papier filigrané JD, 270 x 350 mm à 22 portées ; avec indications de tempo, de nuances et de phrasé, complet. Page de titre : deux traits parallèles au crayon rouge dans l''angle supérieur gauche ; à l''encre noire au milieu, « Sonate nº 2 [«  5  » réécrit par-dessus] | pour piano | Olivier Greif | 12 mai – 30 septembre 74 » ; au vº : « -I- Fantaisie – Caprice | -II- Shadrack | -III- Rondo – Burlesk | -IV- Finale | Duration = circa [50'' biffé, remplacé par] 57'' ».'
  papers:
    - filigrané JD
  items:
    - text: '1. « Fantaisie – Caprice » : signé en haut à gauche, « 2ème sonate pour piano » au milieu, « 12 mai 74 » daté en haut à droite ; p. 1 à 4, 6, 11-12, 14 à 27 au crayon ; p. 5, 7 à 9, 13 à l''encre noire ; nº  du mouvement et changements de tempi soulignés au crayon rouge ; nº  de mes. soulignés au crayon bleu ; nombreuses ratures ; p. 27 rº, deux mes. lourdement raturées une mes. avant la fin, signature au crayon dans la marge droite, « le jour de gloire est arrivé 19'' » en bas à droite ; p. 27 vº, non paginé laissé blanc avec en haut au milieu, le texte suivant à l''encre noire lourdement raturé au crayon « J''ai tout compris ! J''ai tout compris ! | La seule chose que je puisse faire c''est pleurer. | La foi n''est plus. Je vous en supplie Mon Dieu. | Redonnez au monde la Foi. »'
    - text: '2. « Shadrack » : titre, tempo, instrumentation, métrique et texte suivant en haut à droite, écrits à l''encre noire « But the Lord sent | an angel with the snow-white | wings, Down in the middle of | the furnace, Talkin'' to the | children | ''bout the | power | of the | Gospel. » ; « yes » écrit au crayon dans la marge gauche ; p. 28 à 34 au crayon avec changements de tempi et nº  de mesures soulignés au crayon bleu ; p. 34 signature à la fin du mouvement ; p. 34 vº laissé blanc'
    - text: '3. « Rondo-Burlesk » : titre « -3- Intermezzo - » en haut au milieu au crayon souligné au crayon bleu, « Rondo (Burla) » en haut à droite au crayon rouge souligné de bleu, en dessous « Rondo – Burlesk » à l''encre noire ; p. 41, 43, 44 (moitié supérieure), 45 (moitié inférieure), 46 à 49 à l''encre noire ; changements de tempi soulignés au crayon rouge, nº  de mesures au crayon gris ; nombreuses ratures ; p. 48 musique écrite à l''encre noire, aux crayons gris, bleu et rouge avec deux sections lourdement raturées ; p. 54 date au crayon à la fin du mouvement « 25-6-74 », signature à l''encre noire, « 18'' » avec en dessous « 1225 » [somme des mesures des trois premiers mvt.]'
    - text: '4. « Finale » : titre « 4- Finale » en haut au milieu à l''encre noire ; changements de tempi soulignés au crayon bleu, nº de mesures au crayon bleu de 10 à 160, à l''encre bleue de 170 à fin ; p. 66, 1/2 système raturé au crayon gris et rouge ; p. 70, deux systèmes bas de page lourdement raturés au crayon ; p. 78 signature à l''encre noire à la fin'
  institution: f-pmm
  features:
    - autograph
remarks:
  - Ms. hétérogène dans sa présentation ; les 1^er^ et 3^e^ mvt. montrent de nombreux passages remaniés ; pages généralement séparées excepté 1^er^ mvt. p. 19 à 22 et 23 à 26 in-folio ; 2^e^ mvt. p. 32 à 34 in-folio ; 3^e^ mvt. p. 35 à 54 in-folio en cahier ; 4^e^ mvt. p. 55 à 78 in-folio en cahier, p. 59-60, 63-64, 65-66, 71-72 interfoliées.
  - 'Témoignage sonore par l''auteur au piano des cent premières mesures du 1^er^ mvt. dans l''émission radiophonique « Démarches » (épisode 2), diffusé le 22 janvier 1977 sur France Culture et présenté par Gérard Julien Salvy. INA, notice ID : PHD99228330.'
intertextual:
  - '1. « Fantaisie – Caprice » : p. 8, « Le roi des Tongres » au crayon souligné au crayon bleu dans la marge gauche ; « LA PÊCHE DES MOULES » à l''encre noire au-dessus de la portée | « TE QUIERO » entre deux des quatre portées piano ; p. 9 « ¡ Ay Maricruz ! » à l''encre noire au-dessus du deuxième système ; « Yo no sé porqué té quiero » à l''encre noire au-dessus du dernier système ; p. 10 « Se va y no vuelve » à l''encre noire en haut à droite ; « Antichamber » au crayon souligné au crayon bleu, au-dessus du deuxième système ; p. 14 « recuerdos » au crayon encadré au crayon bleu en haut à gauche ; p. 22 « Mein Züsses Lieb » au crayon souligné au crayon rouge en haut à gauche'
  - '3. « Rondo – Burlesk » : p. 47 « Stars & stripes forever » à l''encre noire sous la portée de piano ; p. 48 « Alabama Song » à l''encre noire au début du deuxième système, au-dessus la troisième portée.'
journal:
  - date_text: 16 août 1974
    date: '1974-08-16'
    context: lettre à Thierry Léger
    quotes:
      - « Me voilà rentré d'Angleterre [...]. La Sonate avance gentiment. [...] Je rapporte des partitions de chansons des années 1940-45. » [Séjour qui dura du 27 juillet à la mi-août 1974, duquel il ramena la partition de R. McGimsey qui servit de base au 2^e^ mouvement de la Sonate.]
  - date_text: 20 août 1974
    date: '1974-08-20'
    context: lettre à Nathalie Cholodenko
    quotes:
      - « [...] le "Shadrack" avance à pas de loup. Robert McGimsey doit se retourner dans sa tombe. »
  - date_text: 8 septembre 1974
    date: '1974-09-08'
    quotes:
      - « La journée se passa à finir mon premier mouvement (en vue du concert du soir). »
  - date_text: 9 septembre 1974
    date: '1974-09-09'
    quotes:
      - « J'écrivis "Shadrack" dans l'après-midi. [...] (À ce point-là de mon récit, je crois nécessaire de vous signaler que j'avais terminé mon premier mouvement, le dimanche précédent, dans une tonalité mineure. C'est donc dans cette version que les esprits l'entendirent le soir même ["concert" consistant en l'exécution du premier mouvement de la sonate nº13, à minuit le dimanche 8 septembre pour les esprits qui honoraient de leurs visites les séances de spiritisme pratiquées par l'auteur et divers invités réunis autour de la médium Esther Galil au Moulin des Dames de Septeuil]. Le Lundi matin, je remplaçais ces quelques mesures mineures, par une fin majeure.) »
  - date_text: Date ?
    context: 'Extrait du journal de Patricia Aubertin après l''écoute de la Sonate jouée pour elle par l''auteur :'
    quotes:
      - « Olivier m'a joué [...] les 3 premiers mouvements de sa tentaculaire sonate nº 2. Le 1^er^ à la signification métaphysique, long de 22 minutes, nous entraîne dans les profondeurs et nous élève au plus haut. Lorsqu'il s'achève, dans le "bliss" le plus pur, on croirait que c'est fini, tellement ce premier mouvement est un achèvement en lui-même. Mais arrive le 2^e^ mouvement très court (4 min.) et tout à fait différent (mais n'existe-t-il pas un lien imperceptible), "Shadrack". Toute la verve, l'humour et la virtuosité de Greif s'y retrouve. Le passage qui se voulait divertissement pour l'auditeur, et répit pour le pianiste, est aussi dense que le premier et, paraît-il, encore plus épuisant à jouer. 3^e^ mouvement, 20 minutes. Le "Rondo Burlesk", éblouissant. Olivier est arrivé à un tel point de son évolution qu'il se joue maintenant des difficultés les plus diaboliques. On en sourit presque en écoutant le Rondo, tellement la démonstration est prodigieuse. On sent partout le travail de la forme, l'architecture souveraine. Même le délire est engendré de la rigueur. Je suis persuadée qu'un passage comme "le pianiste ivre" dans le 1^er^ mouvement peut être décortiqué à l'infini sans qu'on y découvre aucune faille d'ordonnance. »
  - date_text: 30 septembre 1974
    date: '1974-09-30'
    quotes:
      - « Terminé ma cinquième sonate pour piano. »
  - date_text: 18 juillet 1993
    date: '1993-07-18'
    quotes:
      - « L'après-midi, je décide d'assister au récital que donne Grigori Sokolov. Plus, je dois l'avouer, avec l'espoir secret de trouver un interprète pour certaines de mes compositions pour piano (le Rêve du monde, les Trois pièces sérieuses, la Sonate dite "de guerre", ou encore – il n'est pas interdit de rêver ! – la grande Sonate en quatre mouvements) que pour écouter ce pianiste russe dont je ne connaissais jusqu'alors rien d'autre que le nom. Mais curieusement, j'ai l'intuition depuis un certain temps qu'un représentant de l'école russe serait le mieux à même de rendre justice à ces ouvrages. Là encore, il est permis de rêver... »
  - date_text: 19 juillet 1993
    date: '1993-07-19'
    quotes:
      - '*cf*. [[wiener-konzert]], *Wiener Konzert*, op.40'
