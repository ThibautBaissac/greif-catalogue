documents:
  - « Je dis à Olivier que l'*Ostinato*, à un certain point de son développement, provoque infailliblement en moi des frissons, et que cette grande sensualité me fait penser à Beethoven. En effet, me répond-il, mon *Ostinato* est aussi une masturbation, comme les œuvres de Beethoven. À chaque phase de la progression, il ajoute un peu de jouissance. Mais comme le désir devient proportionnellement plus grand, on a l'impression qu'il nous est enlevé, ce qui ne fait qu'intensifier le désir. La fin, bien sûr, représente l'orgasme. L'*Ostinato* est une fleur qui s'ouvre et qui trouve son épanouissement en elle-même. » Patricia Aubertin, [Journal intime], 1967
