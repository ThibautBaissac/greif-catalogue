journal:
  - date_text: 4 avril 1974
    date: '1974-04-04'
    quotes:
      - « Cet après-midi, je me suis senti soudain très énervé, presque au bord des larmes. De ce piétinement est sortie une sonatine pour piano en deux mouvements, écrite en l'espace d'une heure et demie. Je me suis senti beaucoup mieux après, surtout que ce n'est pas de la mauvaise musique. »
  - date_text: 20 août 1974
    date: '1974-08-20'
    context: lettre à Nathalie Cholodenko
    quotes:
      - '« J''ai joué hier au soir *Sonatine* à ma belle-sœur Annette. Après l''audition, il y a eu un silence et lorsque je lui ai demandé si cela lui avait plu, elle s''est contentée de me répondre : "Moyen !". Et tout est là. La différence réside dans l''écoute. Bien entendre la musique, c''est la trouver belle. »'
