  items:
    - text: 'Ms. autographe à l''encre noire, non paginé ; 7 f., 31 pages de musique, papier Passantino nº14, 265 x 340 mm à 14 portées ; avec indications de tempo, de nuances et de phrasé, sans nº de mes., complet. Page de titre : en haut à gauche, « – œuvre soixante sixième – », en haut à droite « [signé] Olivier | Juillet – Décembre – 1970 | Paris - Santa Fe - New York – Paris », au milieu, « "troisième sonate pour le piano" | -1- marche | -2- valse | pour Geoffroy Paulmier | [signé] Olivier | 1970 ». Les sept dernières mesures du 1^er^ mvt sont raturées au crayon. Le Ms. porte l''indication « the | end » à droite de la barre de mesure finale du dernier mvt. et « Olivier 1970 | - au "moulin des dames" – Septeuil – » dans le coin inférieur droit de la dernière page.'
