journal:
  - date_text: 20 décembre 1970
    date: '1970-12-20'
    note: 'Extrait du journal de Patricia Aubertin inséré par l''auteur dans son propre journal :'
    quotes:
      - « Olivier va jouer sa Sonate, enfin achevée. À cette occasion, Dalí a fait monter un piano à queue Steinway. Dalí adore la Sonate, en particulier la valse. »
  - date_text: 15 avril 1971
    date: '1971-04-15'
    quotes:
      - '« J''ai reçu aujourd''hui la visite de Madame Liberman. (Épouse du directeur des Editions Condé-Nast, elle a été l''amie intime de Prokofiev et de Stravinsky.) [...] Je joue la Sonate de 1970. Après le premier mouvement : "C''est merveilleux !" A la fin : "Vous avez un talent extraordinaire, sans doute même du génie. Je suis très impressionnée. Vous me connaissez, je dis ce que je pense. [...] »'
