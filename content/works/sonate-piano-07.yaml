    - text: 'Ms. autographe à l''encre noire et au crayon, non paginé ; 2 f., 2 pages de musique, papier filigrané JD, 270 x 350 mm à 20 portées ; sans indications de tempo, de nuance ni de phrasé, inachevé, sans nº de mes., complet. Page de titre : « Cinq Pièces pour piano | Olivier Greif | mars 69 ». La 3^e^ pièce est dédiée à Glenn Gould et porte l''ajout au crayon « [Sonate nº7] » ; elle comporte une large section raturée avec ajout de deux mesures au crayon. La 5^e^ pièce est inachevée : elle débute par 6 mesures à l''encre noire suivies de 4 systèmes au crayon puis des têtes de notes sans hampes sur 2 pages et demie.'
