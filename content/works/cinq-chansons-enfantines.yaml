    - text: >-
        Ms. autographe à l'encre noire avec ajouts au crayon, paginé : 1-8 ; 5
        f., 8 pages de musique, papier filigrané JD, 270 x 350 mm à 22 portées ;
        avec indications de tempo, de nuances et de phrasé, avec nº de mes.,
        complet. Page de titre : « 5 chansons enfantines | Olivier Greif | 61 –
        73 | voice & piano ».
  papers:
