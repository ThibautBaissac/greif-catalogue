remarks:
  - >-
    1961 (mention autographe « 61-73 » sur le manuscrit). 

    Ordre relatif avec T 4 (*Petite Suite*, [1961]) : incertain ; voir la notice
    T 4.

    Nous ignorons si la version d'origine a subi des modifications lors de cette
    mise au net datant de 1973. La dédicace a été ajoutée lors de la révision. 

    Le titre de l'œuvre a été changé dans le CaG pour celui de « Cinq Mélodies »
    mais conserve son titre d'origine sur le Ms. 

    Les titres des mouvements ne figurent pas sur le Ms. mais sont renseignés
    dans le CaG.
