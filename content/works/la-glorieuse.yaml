    - text: 'Brouillon autographe à l''encre rouge avec ajouts à l''encre noire, bleue et au feutre violet, non paginé ; X f., 15 pages de musique, papier filigrané JD ?, 270 x 350 mm à 14 portées ; avec indications de tempo, de nuances et de phrasé, sans nº de mes., inachevé, complet. Page de titre : dessins raturés, nombreux traits, numéros et gribouillis ; au milieu de la page, « pour Patricia Aubertin | "les glorieuses" | Paris le 2 janvier | 1971 » ; écrit à la verticale gauche de la page : « le propre du génie | c''est d''être constamment | dépassé par soi-même ». Au vº : fragment de texte musical (4 mes.) portant les indications « *page I ; * page I bis » ; au milieu de la page : « "les glorieuses" | 1) les glorieuses mathématiques | 2) les glorieuses érotiques | [signé] Olivier » ; grosse portion de texte musical lourdement raturé en bas de la page. Page 1 : dans le coin supérieur gauche, « pour Patricia Aubertin », titre biffé au milieu, dans le coin supérieur droit « [signé ] Olivier | le 2 janvier 1971 », dans la marge droite « texte | de | Matila | Ghyka | et de Pius | Servien | et de | Aristoxène | de | Tarente | et de | Leibniz ».'
