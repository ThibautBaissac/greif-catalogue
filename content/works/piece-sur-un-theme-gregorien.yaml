remarks:
  - >-
    Les principaux dictionnaires et encyclopédies de la musique en circulation
    en France vers 1960 ont été dépouillés sans résultat (détail : voir « État
    de la recherche »). L’ouvrage utilisé par Greif reste à identifier. Il peut
    s’agir d’une édition non consultée, d’un ouvrage d’un autre type
    (encyclopédie générale ou pour la jeunesse, manuel d’initiation musicale),
    ou d’une imprécision du souvenir, rapporté de nombreuses années après les
    faits.
