    context: Lettre au père Jean Claire de Solesmes
    quotes:
      - >-
        « Lorsque j’étais petit, vers l’âge de dix ans, j’ai écrit une pièce
        pour piano, dont je ne me souviens plus du titre mais qui était basée
        sur un thème “chanté par les moines de l’Abbaye de Solesmes” (comme je
        l’avais fièrement noté sur la partition). J’avais trouvé cela dans un
        Dictionnaire de la Musique. »
