  items:
  - text: 'Brouillon autographe au crayon, non paginé ; X., 12 pages de musique, papier filigrané JD,
      270 x 350 mm à 20 portées ; quelques ratures, avec indications de tempo, de nuance et de phrasé,
      inachevé ?, complet. Première page : deux traits parallèles au crayon rouge dans l''angle supérieur
      gauche avec « Light Music » à l''encre noire, en haut au milieu « "The Spirit''s Song" » souligné,
      et dans l''angle supérieur droit « To Esther Galil | a grateful | Spirit ! », à côté, « Olivier
      Greif [souligné] | 7.V.75 ». Quatrième page : Les nom et prénom du compositeur sont écrits à l''encre
      noire à cinq reprises en haut de la page et débordent sur le texte musical ; une autre occurrence
      se trouve sur la cinquième page, où c''est écrit une fois en haut à gauche.'
