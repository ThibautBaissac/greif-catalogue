journal:
- date_text: 21 mars 1967
  date: '1967-03-21'
  quotes:
  - « J'obtiens le premier prix de la classe de composition avec une Sonate pour violon et piano. Lors
    du concours public où elle est interprétée par Devy Erlih et moi-même, salle Berlioz, on remarque
    dans l'assistance la présence de Jacques Brel. »
  - '« Tony Aubin intervient auprès de son éditeur, Leduc, afin qu''il publie ma Sonate pour violon et
    piano. Il me remet en cadeau une lettre, à lui adressée par Gilbert Leduc – qui assistait au concours
    de composition –, dont voici un extrait : [...] J''attends l''acceptation de son père, tuteur naturel,
    pour mettre en gravure sa sonate qui, lorsque j''y repense, est vraiment la pièce maîtresse de tout
    le dernier concours de la rue de Madrid. »'
- date_text: 6 déc. 1968
  date: '1968-12-06'
  quotes:
  - |-
    « Je donne mon premier concert public important : un récital à la Salle Gaveau avec le violoniste Devy Erlih. Au programme : [...] la création "mondiale" de la Sonate qui m'a valu le premier prix de la classe de composition [...].

    J'extrais des commentaires du programme, dus à Maurice Imbert, celui-ci, sur mon travail : "[...] La Sonate pour violon et piano de M. Olivier Greif dont on va avoir la primeur absolue, fut écrite cette année-là aussi. Elle comprend quatre parties dont l'initiale ne s'inspire pas de la 'forme sonate', mais de celle du prélude, ce qu'indique d'ailleurs le vocable la désignant : Introduction. Un thème dont l'intensité croît *poco a poco* est à sa racine. Le second mouvement oppose deux motifs, l'un léger, l'autre plus marqué. L'Andante d'après s'appuie sur une idée calme et le développement fugué de sa section centrale trouble à peine la tranquillité du morceau. Le Finale, coulé dans le moule du rondo, évoque une danse slave."

    Critique due à la plume d'Olivier Alain, parue dans le "Figaro" :

    "[...] La sonate pour piano et violon qu'il a signé lui-même confirme encore cette impression : les ombres et les lumières n'ont jamais un parfum révolutionnaire, encore que l'introduction dégage une vraie poésie. [...]" »
- date_text: 13 décembre 1968
  date: '1968-12-13'
  quotes:
  - |-
    « Article, signé Claude Chamfray, paru dans la revue "Le Mois Musical" :

    "[...] Dans son œuvre, O. Greif prouve qu'il sait écrire et construire. La plume est ferme, elle ne s'égare pas en vains bavardages et l'on ne saurait tenir rigueur à un compositeur de dix-huit ans de subir des influences."

    Article de Lily Bienvenu, paru dans une revue musicale dont je ne retrouve pas le nom :

    "L'atmosphère de tension croissante et décroissante dont l'exposition apparaît déjà si intérieure dans le premier mouvement ; le tourbillon d'esprit du Scherzo, la recherche incolore du III où perce, dans un halo, une personnalité ; le caractère slovaque du final si étonnamment écrit pour le violon expriment éloquemment, dans cette création de la sonate d'Olivier Greif, l'éclosion d'une nature d'élite."
