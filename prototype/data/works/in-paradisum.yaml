documents:
- « [Greif] alla jusqu'à écrire un morceau pour mon récital de fin d'études. [...] Olivier avait écrit
  pour l'occasion et – rendez-vous compte – il avait demandé à Ultra-Violet de chanter sa pièce... Cette
  dernière était alors l'égérie, la superstar d'Andy Warhol et du groupe The Velvet Underground [...].
  Ultra-Violet chantait et Olivier, bien sûr, tenait la partie de piano. [...]
- Quant à sa pièce précédemment citée qu'il avait écrite pour moi, *In Paradisium* [*sic*], il n'en existe
  même plus de trace... [Le titre] venait de lui. [...] [cette pièce] était inspirée directement par Dante
  ! [...] Berio était là, [...] il fut particulièrement élogieux à l'égard de la pièce d'Olivier, une
  sorte de "Fellini-concert" selon lui ! [...] ce fut une exécution unique et dont malheureusement il
  ne reste aucune trace filmée. »
- Interview de William E. Powell retranscrite dans *We are the words, Olivier Greif, Compositeur, Entretiens
  avec ses amis*, recueillis par Anne Bramard-Blagny, Delatour, 2013.
