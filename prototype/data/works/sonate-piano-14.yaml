  quotes:
  - « Me voici revenu d'Écosse, où les quatre concerts ont été très bien reçus, particulièrement celui
    de Glasgow, un franc succès. J'avais inscrit au programme de chaque concert ma "Sonate dans le goût
    ancien", et à Glasgow, j'ai rajouté le final de ma Sonate en trois mouvements [[[sonate-piano-15]],
    op.54]. »
