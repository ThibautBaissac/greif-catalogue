remarks:
- Nous ignorons si la version d'origine a subi des modifications lors de cette mise au net datant de 1971.
  Les droits de mise en musique des poèmes « Immense et rouge » et « Chanson » appartenant de manière
  exclusive à Joseph Kosma via les éditions Enoch, la publication de cette œuvre est interdite avant que
  ces poèmes ne tombent dans le domaine public, soit 2047.
