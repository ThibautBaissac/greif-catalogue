      270 x 345 mm à 24 portées, Registre ARM ? ; sans indications de tempo, de nuances ni de phrasé,
      sans nº de mes., inachevé, complet. Page 1 : en haut au milieu, « 7.000 pounds », en haut à droite,
      « Le Triomphe de la | Tonalité », dans le coin supérieur droit, « 1972 | Haridas ». Seule la première
      ligne du Ms. est complète avec les deux voix du piano, le reste de la pièce n''a que la main droite
