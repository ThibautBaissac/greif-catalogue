[build]
  command = "npm run build"
  publish = "dist"
  # Skips the build of a Keystatic push whose Th await renumbering (see .github/workflows/renumber-th.yml).
  ignore = "node scripts/th-ignore.ts"

[build.environment]
  NODE_VERSION = "22"

# Temporary: remove this block when the catalogue is ready for search indexing.
[[headers]]
  for = "/*"

  [headers.values]
    X-Robots-Tag = "noindex"

[context.deploy-preview.environment]
  CATALOGUE_EDITORIAL = "1"

[context.branch-deploy.environment]
  CATALOGUE_EDITORIAL = "1"
